name: Hent billeder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hent Dribbble-billeder
        run: |
          mkdir -p assets/projects
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          while read id img; do
            [ -z "$id" ] && continue
            [ -n "$(ls assets/projects/$id.* 2>/dev/null)" ] && continue
            curl -sL -A "$UA" -H "Referer: https://dribbble.com/" -o "/tmp/$id" "$img"
            case "$(file -b --mime-type /tmp/$id)" in
              image/webp) ext=webp;; image/jpeg) ext=jpg;; image/png) ext=png;; image/gif) ext=gif;;
              *) echo "IKKE BILLEDE $id"; continue;;
            esac
            mv "/tmp/$id" "assets/projects/$id.$ext"
            echo "OK $id.$ext"
          done < assets/projects-sources.txt

      - name: Hent logoer fra liste
        run: |
          mkdir -p assets/logos
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          while read d img; do
            [ -z "$d" ] && continue
            curl -sL -A "$UA" -o "/tmp/logo" "$img"
            case "$(file -b --mime-type /tmp/logo)" in
              image/webp) ext=webp;; image/jpeg) ext=jpg;; image/png) ext=png;; image/gif) ext=gif;; image/svg+xml|text/xml|text/html|text/plain) grep -q "<svg" /tmp/logo && ext=svg || { echo "LISTE FEJL $d"; continue; };;
              *) echo "LISTE FEJL $d"; continue;;
            esac
            rm -f assets/logos/$d.*
            mv /tmp/logo "assets/logos/$d.$ext"
            echo "LISTE OK $d.$ext"
          done < assets/logos-sources.txt

      - name: Hent avatar
        run: python3 .github/scripts-fetch.py

      - name: Gem i repoet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Hentede billeder"
          git push
