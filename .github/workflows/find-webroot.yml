name: Find web-mappe

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Tjek host
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          echo "Længde på SFTP_HOST: ${#SFTP_HOST} (forventet 25)"
          case "$SFTP_HOST" in *" "*) echo "SFTP_HOST indeholder mellemrum";; esac
          case "$SFTP_HOST" in *:*) echo "SFTP_HOST indeholder kolon";; esac
          echo "Opslag af ssh.c35b6990h.service.one:"
          getent hosts ssh.c35b6990h.service.one || echo "kunne ikke slås op"
          echo "IPv4 for service.one-host:"; getent ahostsv4 ssh.c35b6990h.service.one | head -1 || true
          echo "IPv4 for ssh.langkildelarsen.dk:"; getent ahostsv4 ssh.langkildelarsen.dk | head -1 || true
          echo "IPv6-forbindelse:"; curl -6 -s -m 8 -o /dev/null -w '%{http_code}\n' https://ipv6.google.com || echo "ingen IPv6"

      - name: Vis mapper på serveren
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set sftp:connect-program "ssh -a -x -4";
            pwd;
            cls -1 -d */;
            cls -1 -d */*/;
            cls -1 -d */*/*/;
            bye
          "
