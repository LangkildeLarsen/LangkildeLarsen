name: Deploy til one.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          if [ -z "$SFTP_PATH" ]; then echo "SFTP_PATH mangler – deploy springes over."; exit 1; fi
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            set sftp:connect-program "ssh -a -x -4";
            set net:max-retries 3;
            set net:timeout 30;
            mirror -R --verbose --parallel=4 \
              --exclude ^\.git/ \
              --exclude-glob .git* \
              --exclude ^\.github/ \
              --exclude ^data/ \
              --exclude-glob *.md \
              ./ $SFTP_PATH;
            rm -r -f $SFTP_PATH/.git;
            rm -r -f $SFTP_PATH/.github;
            bye
          "

      - name: Tjek siden
        run: |
          sleep 5
          for h in langkildelarsen.dk www.langkildelarsen.dk; do echo "DNS $h: $(getent ahostsv4 $h | head -1)"; done
          for u in https://langkildelarsen.dk/ https://www.langkildelarsen.dk/ http://langkildelarsen.dk/ https://langkildelarsen.dk/admin/ https://langkildelarsen.dk/inc/bootstrap.php https://langkildelarsen.dk/.git/config; do
            code=$(curl -4 -sS -o /tmp/p -w '%{http_code}' -m 20 "$u" 2>/tmp/err) || true
            echo "$code $u $(grep -o '<title>[^<]*' /tmp/p 2>/dev/null | head -1) $(cat /tmp/err)"
          done
